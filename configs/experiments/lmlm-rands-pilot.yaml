# Phase 2 pilot-manifest contract. This is not an executable training configuration yet.
protocol:
  name: lmlm-rands-pilot
  phase: 2
  state: in_review

references:
  paper:
    title: "Beyond Raw Bytes: Towards Large Malware Language Models"
    doi: 10.14722/ndss.2026.230103
  rawbyteclf:
    repository: https://github.com/lkurlandski/RawByteClf
    commit: 2502450e40ac00363e168106662aac29821d4a93
  rands_snapshot: "2026-09-02"

research_scope:
  claim: Adapt the LMLM methodology to RanDS; do not claim the paper's original scores.
  task:
    name: ransomware_vs_benign
    labels: {benign: 0, ransomware: 1}
    note: RanDS ransomware is not general malware.

cohort:
  required_metadata:
    extensions: [EXE, DLL]
    arch: I386
    packed: 0
    source_file: available_in_expected_sha256_shard
  adaptation_note: I386 and Packed=0 are RanDS metadata proxies, not reruns of Linux file and diec.

pilot:
  purpose: Validate the data path only; do not report model performance as a scientific result.
  target_samples: 1000
  target_labels: {benign: 500, ransomware: 500}
  selection:
    method: sha256_rank
    seed: lmlm-rands-pilot-v1
    ransomware_family_allocation:
      method: proportional_largest_remainder
      tie_breaker: SHA-256 of the selection seed and family name
      low_support: Do not force every family into the pilot; report zero or all-selected families.
  source_verification: Hash every selected source PE and compare it with its canonical SHA-256.

representations:
  first: EXE
  exe:
    definition: Concatenate raw bytes from PE sections marked executable or containing code.
    selection_flags: [IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_CNT_CODE]
    order: PE section-table order
    range_rule: Use raw offset and raw size; record invalid or empty sections as structured failures.
    parser: deferred_to_phase_3
  raw: Full source PE bytes; comparison representation after the EXE pilot.
  dis: Ghidra headless instruction stream without function signatures; deferred to Phase 6.
  dec: Ghidra headless decompiler output; deferred to Phase 7.

integrity_and_leakage:
  source_identity: SHA-256 of the source PE.
  representation_identity: SHA-256 of exact derived bytes.
  rule: Build representation-equivalence groups before any scientific split.
  conflicting_labels: Exclude a representation group if it appears in both labels.
  same_label_duplicates: Keep one deterministic representative; record every removal.

later_training_contract:
  tokenizer: EXE words are non-overlapping 16-byte blocks; compare BPE and unigram after splitting.
  lengths: [4096, 8192, 16384, 32768, 65536]
  primary_detection_metrics: [roc_auc, accuracy]
  deferred:
    - EXE parser choice after synthetic compatibility tests
    - scientific split proportions after representation groups and year distributions exist
    - padding and first trainable model after representation-size measurements
    - DIS and DEC toolchains

phase_boundary:
  phase_1: No PE parsing, manifest creation, tokenizer fitting, or training.
  phase_2: Create and fully source-hash-verify the deterministic 1,000-sample manifest.
